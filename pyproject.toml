[project]
name = "deerflow-code-factory-extension"
version = "0.1.0"
description = "Issue-driven code factory for DeerFlow"
requires-python = ">=3.12"
dependencies = ["deerflow-extension-api>=0.2.5,<0.3", "httpx>=0.27,<1"]

[project.entry-points."deerflow.extensions"]
code-factory = "deerflow_code_factory:install"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deerflow_code_factory"]
